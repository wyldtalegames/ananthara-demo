<!DOCTYPE html>
<html data-ana-ui-lab="true" data-ana-theme="original">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ananthara: The Lost Fragments — UI Lab</title>
<script>window.version="UNKNOWN"</script>
<script src="version.js"></script>
<script src="../persist.js"></script>
<script src="../alertify.min.js"></script>
<script src="../util.js"></script>
<link href="../style.css" rel="stylesheet" type="text/css">
<link href="ananthara_game.css" rel="stylesheet" type="text/css">
<link href="oracle_cards.css" rel="stylesheet" type="text/css">
<link href="stats_ui.css" rel="stylesheet" type="text/css">
<link id="anaThemeArchive" data-ana-theme-sheet="archive" href="themes/ananthara_theme_archive.css" rel="stylesheet" disabled>
<link id="anaThemeCodex" data-ana-theme-sheet="codex" href="themes/ananthara_theme_codex.css" rel="stylesheet" disabled>
<link id="anaThemeReliquary" data-ana-theme-sheet="reliquary" href="themes/ananthara_theme_reliquary.css" rel="stylesheet" disabled>
<link id="anaThemeCelestial" data-ana-theme-sheet="celestial" href="themes/ananthara_theme_celestial_astrolabe.css" rel="stylesheet" disabled>
<style id="dynamic"></style>
<script src="../ui.js"></script>
<script src="../scene.js"></script>
<script src="../navigator.js"></script>
<script src="mygame.js"></script>
<script src="oracle_cards.js"></script>
<script src="stats_ui.js"></script>
<script src="ananthara_shell.js"></script>
<script src="ananthara_intro.js"></script>
<script src="ananthara_ui_lab.js"></script>
<link href="../alertify.css" rel="stylesheet" type="text/css">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
window.storeName = "ananthara_game";
var rootDir = "../";
</script>
</head>
<body>
<div id="anantharaIntro" class="ana-intro video-pending" aria-label="Ananthara">
  <video class="ana-intro-video" autoplay muted loop playsinline preload="auto">
    <source src="Assets/video/intro.mp4" type="video/mp4">
  </video>
  <div class="ana-intro-shade"></div>
  <div class="ana-intro-content">
    <h1><span class="ana-title-main">ANANTHARA</span><span class="ana-title-sub">THE LOST FRAGMENTS</span></h1>
    <div id="anaIntroMenu" class="ana-intro-menu">
      <button type="button" data-intro-action="begin">Begin Your Journey</button>
      <button type="button" id="anaContinue" data-intro-action="continue" hidden>Return to Ananthara</button>
      <button type="button" id="anaLoadGame" data-intro-action="load" hidden>Load Game</button>
      <button type="button" data-intro-action="world">The World of Ananthara</button>
      <button type="button" data-intro-action="leave">Leave the Path</button>
    </div>
    <div id="anaLanguage" class="ana-language" hidden>
      <p>Choose your language · Wähle deine Sprache</p>
      <button type="button" data-language="de">Deutsch</button>
      <button type="button" data-language="en">English</button>
    </div>
  </div>
  <div id="anaWorldModal" class="ana-world-modal" hidden>
    <div class="ana-world-card" role="dialog" aria-modal="true" aria-labelledby="anaWorldTitleLab">
      <h2 id="anaWorldTitleLab">The World of Ananthara</h2>
      <p>Welcome to Ananthara, a world shaped by ancient kingdoms, sacred magic and forgotten truths.</p>
      <button type="button" data-intro-action="close-world">Close</button>
    </div>
  </div>
</div>
<div class="ananthara-fireflies" aria-hidden="true">
  <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
  <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
  <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
  <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
</div>
<div class="container" id="container1">
  <div id="advertisement"></div>
  <div id="header">
    <div id="identity"><a href="#" id="email" style="display:none">you@example.com</a><a href="#" onclick="logout(); loginDiv(); return false;" id="logout" style="display:none">Sign Out</a></div>
    <h1 id="title" class="gameTitle"></h1>
    <h2 id="author" class="gameTitle"></h2>
    <p id="headerLinks"></p>
    <p id="buttons">
      <button id="statsButton" class="spacedLink" onclick="showStats()">Show Stats</button>
      <button id="achievementsButton" onclick="showAchievements()" class="spacedLink" style="display:none">Achievements</button>
      <button id="bugButton" onclick="reportBug()" class="spacedLink" style="display:none">Report Bug</button>
      <button id="menuButton" onclick="showMenu()" class="spacedLink">Menu</button>
    </p>
  </div>
  <div id="main"><div id="text"></div><script>startLoading();</script></div>
  <div id="mobileLinks" class="webOnly"></div>
  <noscript><p>This game requires JavaScript; please enable JavaScript and refresh this page.</p></noscript>
</div>
</body>
</html>
